name: publish-marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketplace
        uses: actions/checkout@v4
        with:
          path: marketplace

      - name: Check TCLAW_REPO_TOKEN configured
        env:
          TCLAW_TOKEN: ${{ secrets.TCLAW_REPO_TOKEN }}
        run: |
          if [ -z "${TCLAW_TOKEN}" ]; then
            echo "::error::secrets.TCLAW_REPO_TOKEN 未配置（主仓库为 private，GITHUB_TOKEN 无法跨仓库拉取）。请生成对 hustcsh/tclaw_project 只读 Contents 权限的 fine-grained PAT 并配置到本仓库 secrets。"
            exit 1
          fi

      - name: Checkout tclaw (skills source)
        uses: actions/checkout@v4
        with:
          repository: hustcsh/tclaw_project
          ref: main
          path: tclaw
          # 主仓库为 private：GITHUB_TOKEN 无法跨仓库访问，必须用
          # 对 tclaw_project 有 Contents:Read 权限的 fine-grained PAT
          # （仓库 Settings → Secrets → Actions → TCLAW_REPO_TOKEN）
          token: ${{ secrets.TCLAW_REPO_TOKEN }}

      - name: Build registry + skill zips
        run: |
          cd marketplace
          ./scripts/build-registry.sh ../tclaw/tclaw/skills public

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd marketplace/public
          git init -b gh-pages .
          git config user.name "marketplace-ci"
          git config user.email "ci@tclaw.local"
          git add -A
          if ! git commit -m "marketplace build $(date -u +%Y%m%dT%H%M%SZ)"; then
            echo "ERROR: nothing to commit — build produced empty public/"
            ls -laR .
            exit 1
          fi
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/hustcsh/tclaw-marketplace.git"
          git push -f origin gh-pages

  # 可选：同步 Gitee 镜像（需在 Gitee 将 hustcsh/tclaw-marketplace 建为 GitHub
  # 仓库的镜像仓库，并配置 GITEE_TOKEN secret；未配置时本 job 自动跳过）
  sync-gitee:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gitee mirror sync
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "GITEE_TOKEN not configured, skip gitee sync"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/hustcsh/tclaw-marketplace/pull" \
            -d "access_token=${GITEE_TOKEN}" || echo "WARN: gitee sync failed (check mirror repo + token)"
